version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "paxeer-network/devops"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      hardhat:
        patterns:
          - "hardhat*"
          - "@nomicfoundation/*"
      ethers:
        patterns:
          - "ethers*"
      testing:
        patterns:
          - "chai*"
          - "mocha*"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "paxeer-network/devops"
    labels:
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
