specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EventEmitter
    network: paxeer-network
    source:
      address: "0x83Fbd4b98fF5E42cbe2A2B51E6c658B8a8f142F6"
      abi: EventEmitter
      startBlock: 500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Market
        - Token
        - Swap
        - User
        - MarketHourData
        - MarketDayData
        - ProtocolDayData
      abis:
        - name: EventEmitter
          file: ./abis/EventEmitter.json
        - name: HLPMMPool
          file: ./abis/HLPMMPool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,indexed uint256,address,string,string,uint256)
          handler: handleMarketCreated
        - event: Swap(indexed address,indexed address,address,address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: FeeClaimed(indexed address,indexed uint256,indexed address,uint256,uint256)
          handler: handleFeeClaimed
        - event: FeeStrategyUpdated(indexed uint256,uint8,uint256)
          handler: handleFeeStrategyUpdated
      file: ./src/event-emitter.ts

  - kind: ethereum
    name: MarketNFT
    network: paxeer-network
    source:
      address: "0x68c92DD2cE0CB45F7Ed596DA4afbFAE69bd9Da08"
      abi: MarketNFT
      startBlock: 500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketNFT
        - NFTTransfer
        - User
      abis:
        - name: MarketNFT
          file: ./abis/MarketNFT.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleNFTTransfer
        - event: FeeStrategyUpdated(indexed uint256,uint8)
          handler: handleNFTFeeStrategyUpdated
        - event: FeesClaimed(indexed uint256,indexed address,uint256)
          handler: handleNFTFeesClaimed
      file: ./src/market-nft.ts

  - kind: ethereum
    name: HLPMMFactory
    network: paxeer-network
    source:
      address: "0xEF283FF45379e2d47Ce8db0C613125072c1A1c58"
      abi: HLPMMFactory
      startBlock: 500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Market
      abis:
        - name: HLPMMFactory
          file: ./abis/HLPMMFactory.json
        - name: HLPMMPool
          file: ./abis/HLPMMPool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,indexed uint256,address)
          handler: handleFactoryMarketCreated
      file: ./src/factory.ts

  - kind: ethereum
    name: USID
    network: paxeer-network
    source:
      address: "0x6C32c255EeBD6A72B56ee82454d7140020919652"
      abi: ERC20
      startBlock: 500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - UserTokenBalance
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUSIDTransfer
      file: ./src/usid.ts

templates:
  - kind: ethereum
    name: HLPMMPool
    network: paxeer-network
    source:
      abi: HLPMMPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Swap
      abis:
        - name: HLPMMPool
          file: ./abis/HLPMMPool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Sync(uint256,uint256)
          handler: handleSync
      file: ./src/pool.ts

  - kind: ethereum
    name: HLPMMToken
    network: paxeer-network
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
        - UserTokenBalance
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTokenTransfer
      file: ./src/token.ts
